[pytest]
testpaths = tests
# One async plugin, one event loop.
#
# The suite previously mixed @pytest.mark.anyio (anyio's plugin) with
# pytest_asyncio fixtures. Those two plugins run fixtures and tests in
# *different* event loops, so any DB-backed test died with "got Future
# attached to a different loop" as soon as it actually touched PostgreSQL.
# Everything is pytest-asyncio now; auto mode means tests and fixtures do not
# need markers at all.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
