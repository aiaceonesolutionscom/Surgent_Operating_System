[alembic]
script_location = alembic
# env.py imports src.config — without this, `import src` fails because the
# backend/ directory isn't on sys.path when alembic runs.
prepend_sys_path = .

# The real URL is injected at runtime by alembic/env.py from Settings
# (DATABASE_URL), so nothing secret lives here.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
