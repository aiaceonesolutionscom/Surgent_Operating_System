server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hashed build assets: cache for a year, and NEVER fall back to index.html -
    # a chunk that disappeared after a deploy must 404 (so the app can recover)
    # instead of returning the HTML shell with a 200 that the browser then tries
    # to run as JavaScript.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The shell must always be revalidated so users pick up a new deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Private areas are not for search engines.
    location ~ ^/(dashboard|super-admin|admin|user|portal) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }

    # React Router uses client-side routes - any path that doesn't match a real
    # file falls back to index.html so they work on a direct load/refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
